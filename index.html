<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Pomodoro</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body data-mode="focus" data-running="false">
    <main class="widget" data-tauri-drag-region>
      <header class="bar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14Zm0 0 7-7" /></svg>
          pomodoro
        </span>
        <div class="win">
          <button id="mute" title="Mute ambience (M)" aria-pressed="false">
            <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4v-5Zm11.5-.5a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11" /></svg>
            <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4v-5Zm11.5.5 5 5m0-5-5 5" /></svg>
          </button>
          <button id="gear" title="Your timeline" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
          </button>
          <button id="pin" title="Keep on top" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6Zm3 9v7" /></svg>
          </button>
          <button id="min" title="Minimize">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <button id="close" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
          </button>
        </div>
      </header>

      <nav class="pages" role="tablist">
        <button role="tab" data-page="timer" aria-selected="true">Timer</button>
        <button role="tab" data-page="tasks" aria-selected="false">Tasks <span class="count" id="task-count"></span></button>
      </nav>

      <div class="page" data-page="timer">

      <section class="dial" data-tauri-drag-region>
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-progress" id="ring" cx="100" cy="100" r="88" />
        </svg>
        <div class="readout">
          <span class="mode" id="mode">Focus</span>
          <span class="time" id="time">25:00</span>
          <span class="dots" id="dots"></span>
          <span class="active-task" id="active-task"></span>
        </div>
      </section>

      <nav class="controls">
        <button id="reset" class="ghost" title="Reset (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></svg>
        </button>
        <button id="toggle" class="play" title="Start / pause (Space)">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z" /></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
        </button>
        <button id="skip" class="ghost" title="Skip (S)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 8 6-8 6V6Zm12 0v12" /></svg>
        </button>
      </nav>

      <section class="mixer" aria-label="Ambience mix">
        <div class="tabs" role="tablist">
          <button role="tab" data-scope="focus" aria-selected="true">Focus mix</button>
          <button role="tab" data-scope="break" aria-selected="false">Break mix</button>
        </div>
        <label class="layer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 5.5 8M13 4.5 11.5 8M19 4.5 17.5 8M10 11l-1.5 3.5M16 11l-1.5 3.5M7 17.5 5.5 21M13 17.5 11.5 21" /></svg>
          <span>Rain</span>
          <input type="range" min="0" max="100" data-layer="0" />
        </label>
        <label class="layer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.6-5.3 3.6-8.8 2.2 1.5 3 3.4 3 5.2 1-.6 1.8-1.7 2-3 2 1.6 4.4 4 4.4 6.8 0 3.5-2.6 6-6.5 6Z" /></svg>
          <span>Fire</span>
          <input type="range" min="0" max="100" data-layer="1" />
        </label>
        <label class="layer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3 6 13.5h5.5L10 21l8-11h-5.5l1-7Z" /></svg>
          <span>Thunder</span>
          <input type="range" min="0" max="100" data-layer="2" />
        </label>
      </section>
      </div>

      <div class="page tasks" data-page="tasks" hidden>
        <ul class="task-list" id="task-list"></ul>
        <p class="empty" id="task-empty">No tasks yet. Add what you want to get done today.<br />Tap a task to work on it.</p>
        <form class="add-task" id="add-task" autocomplete="off">
          <input id="task-title" maxlength="80" placeholder="Add a task…" aria-label="New task" />
          <button type="button" id="task-kind" class="kind" aria-pressed="false" title="One-off: gone the day after you finish it">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1" /></svg>
          </button>
          <button type="submit" class="add" title="Add task">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </form>
      </div>

      <section class="panel" id="settings" hidden>
        <h2>Your timeline</h2>
        <div class="step">
          <span>Focus</span>
          <button data-key="focus" data-delta="-5" aria-label="Less focus">−</button>
          <input type="number" data-key="focus" min="1" max="180" aria-label="Focus" />
          <button data-key="focus" data-delta="5" aria-label="More focus">+</button>
          <small>min</small>
        </div>
        <div class="step">
          <span>Short break</span>
          <button data-key="short" data-delta="-1" aria-label="Less short break">−</button>
          <input type="number" data-key="short" min="1" max="60" aria-label="Short break" />
          <button data-key="short" data-delta="1" aria-label="More short break">+</button>
          <small>min</small>
        </div>
        <div class="step">
          <span>Long break</span>
          <button data-key="long" data-delta="-5" aria-label="Less long break">−</button>
          <input type="number" data-key="long" min="1" max="90" aria-label="Long break" />
          <button data-key="long" data-delta="5" aria-label="More long break">+</button>
          <small>min</small>
        </div>
        <div class="step">
          <span>Sessions per set</span>
          <button data-key="cycles" data-delta="-1" aria-label="Less sessions per set">−</button>
          <input type="number" data-key="cycles" min="1" max="12" aria-label="Sessions per set" />
          <button data-key="cycles" data-delta="1" aria-label="More sessions per set">+</button>
          <small></small>
        </div>
        <label class="switch"><input type="checkbox" data-key="auto_breaks" /> <span>Start breaks automatically</span></label>
        <label class="switch"><input type="checkbox" data-key="auto_focus" /> <span>Start focus automatically</span></label>
        <p class="hint">Changes to a phase that's already running apply from the next phase.</p>
        <button class="done" id="settings-done">Done</button>
      </section>

      <svg class="treeline" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true">
        <path class="far" d="M0 60V38l12-16 12 16 8-10 10 12 14-20 14 20 9-12 11 13 13-18 13 18 10-11 12 12 15-22 15 22 9-10 10 11 13-17 13 17 11-13 12 14 14-19 14 19 12-15 12 15 12-14 12 14V60Z" />
        <path class="near" d="M0 60V48l8-10 8 10 6-6 7 8 10-14 10 14 7-8 8 9 11-13 11 13 6-7 8 8 12-16 12 16 7-8 8 9 10-12 10 12 9-11 9 11 12-15 12 15 8-9 8 9 11-14 11 14 9-10 9 10 12-15 12 15V60Z" />
      </svg>
    </main>
  </body>
</html>
